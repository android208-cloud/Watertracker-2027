<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" font-family="system-ui, sans-serif">
  <!-- Разметочная сетка главного экрана Watertracker-next, канон v2 (05.11).
       Линии — буквы, пересечения — цифры (слово владельца 05.11).
       Край холста — тоже линия: О верх (под системным статус-баром, который
       прибавляется сверху и сетку не ломает), П низ, Р лево, С право.
       Вертикали А–Е — центры колонок дока. Горизонтали: Ж ось полосы
       прогресса (середина О–З), З ось шапки (О–З = К–Л = шагу дока),
       И центр сцены (место кота), К/Л/М ряды дока 0/1/2, Н навигация.
       Пересечения дока — цифры 1–18 по рядам К, Л, М. -->
  <rect x="0" y="0" width="412" height="892" fill="#f1f2f4"/>
  <rect x="0.5" y="0.5" width="411" height="891" fill="none" stroke="#c8a13a" stroke-width="2"/>
  <g stroke="#5aade8" stroke-width="1" stroke-dasharray="4 4" opacity="0.75">
    <line x1="41" y1="24" x2="41" y2="880"/>
    <line x1="107" y1="24" x2="107" y2="880"/>
    <line x1="173" y1="24" x2="173" y2="880"/>
    <line x1="239" y1="24" x2="239" y2="880"/>
    <line x1="305" y1="24" x2="305" y2="880"/>
    <line x1="371" y1="24" x2="371" y2="880"/>
    <line x1="24" y1="43.9" x2="400" y2="43.9"/>
    <line x1="24" y1="87.9" x2="400" y2="87.9"/>
    <line x1="24" y1="361.6" x2="400" y2="361.6"/>
    <line x1="24" y1="608.8" x2="400" y2="608.8"/>
    <line x1="24" y1="696.7" x2="400" y2="696.7"/>
    <line x1="24" y1="784.6" x2="400" y2="784.6"/>
    <line x1="24" y1="864" x2="400" y2="864"/>
  </g>
  <g fill="#1da0e8" font-size="14" font-weight="700" text-anchor="middle">
    <text x="41" y="16">А</text><text x="107" y="16">Б</text><text x="173" y="16">В</text><text x="239" y="16">Г</text><text x="305" y="16">Д</text><text x="371" y="16">Е</text>
    <text x="12" y="47.9">Ж</text><text x="12" y="91.9">З</text><text x="12" y="365.6">И</text><text x="12" y="612.8">К</text><text x="12" y="700.7">Л</text><text x="12" y="788.6">М</text><text x="12" y="868">Н</text>
  </g>
  <g fill="#c8a13a" font-size="13" font-weight="700" text-anchor="middle">
    <text x="206" y="16">О</text><text x="206" y="886">П</text>
    <text x="12" y="450">Р</text><text x="400" y="450">С</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g fill="#1da0e8">
      <circle cx="41" cy="608.8" r="12"/>
      <circle cx="107" cy="608.8" r="12"/>
      <circle cx="173" cy="608.8" r="12"/>
      <circle cx="239" cy="608.8" r="12"/>
      <circle cx="305" cy="608.8" r="12"/>
      <circle cx="371" cy="608.8" r="12"/>
      <circle cx="41" cy="696.7" r="12"/>
      <circle cx="107" cy="696.7" r="12"/>
      <circle cx="173" cy="696.7" r="12"/>
      <circle cx="239" cy="696.7" r="12"/>
      <circle cx="305" cy="696.7" r="12"/>
      <circle cx="371" cy="696.7" r="12"/>
      <circle cx="41" cy="784.6" r="12"/>
      <circle cx="107" cy="784.6" r="12"/>
      <circle cx="173" cy="784.6" r="12"/>
      <circle cx="239" cy="784.6" r="12"/>
      <circle cx="305" cy="784.6" r="12"/>
      <circle cx="371" cy="784.6" r="12"/>
    </g><g fill="#ffffff">
      <text x="41" y="612.8">1</text>
      <text x="107" y="612.8">2</text>
      <text x="173" y="612.8">3</text>
      <text x="239" y="612.8">4</text>
      <text x="305" y="612.8">5</text>
      <text x="371" y="612.8">6</text>
      <text x="41" y="700.7">7</text>
      <text x="107" y="700.7">8</text>
      <text x="173" y="700.7">9</text>
      <text x="239" y="700.7">10</text>
      <text x="305" y="700.7">11</text>
      <text x="371" y="700.7">12</text>
      <text x="41" y="788.6">13</text>
      <text x="107" y="788.6">14</text>
      <text x="173" y="788.6">15</text>
      <text x="239" y="788.6">16</text>
      <text x="305" y="788.6">17</text>
      <text x="371" y="788.6">18</text>
    </g></g>
  <g fill="#5c6670" font-size="10" text-anchor="middle">
    <text x="41" y="636">1: отмена</text><text x="371" y="636">6: выбор напитка</text>
    <text x="140" y="724">7–11: ярлыки недавних пар</text><text x="371" y="724">12: место (избранные)</text>
    <text x="74" y="812">13:14: пилюля объёма</text><text x="206" y="812">15:16: место (чашка)</text>
    <text x="305" y="812">17: место</text><text x="305" y="824">(погода)</text>
    <text x="371" y="812">18: место</text><text x="371" y="824">(активность)</text>
    <text x="206" y="40">Ж: ось полосы прогресса</text>
    <text x="206" y="104">З: шапка (название напитка)</text>
    <text x="206" y="382">И: сцена — место кота (M05/M06)</text>
    <text x="206" y="880">Н: навигация</text>
  </g>
</svg>
